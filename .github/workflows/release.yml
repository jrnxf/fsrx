name: release

# Builds fsrx for macOS, Linux and Windows, publishes the binaries as a GitHub release, publishes the
# crate, then points the Homebrew formula at the release, so `brew install jrnxf/tap/fsrx` installs a
# prebuilt binary instead of building with cargo.
#
# - A tag `v<version>` pushed by hand publishes that release. The tag must match the version in
#   Cargo.toml, because the same version goes to crates.io. A tag with a hyphen publishes a
#   pre-release: it never shows as Latest, and the formula and crates.io do not follow it.
# - A pull request that changes this file or the dependencies builds every binary without
#   publishing, to prove the build before a release depends on it. Running the workflow by hand
#   (workflow_dispatch) does the same.
#
# The release's assets, each with a `.sha256`:
# - fsrx-<version>-<target>.tar.gz for aarch64-apple-darwin, x86_64-apple-darwin,
#   x86_64-unknown-linux-musl and aarch64-unknown-linux-musl. The Linux binaries are static, so they
#   run on any Linux, whatever its C library.
# - fsrx-<version>-x86_64-pc-windows-msvc.zip.
# Each archive holds one folder, fsrx-<version>-<target>/, with the executable fsrx (fsrx.exe on
# Windows), README.md and LICENSE.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older build pointless; a release always finishes.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Linux binary is built on its own architecture, so it can be run before it ships.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Built on Apple silicon, as GitHub's Intel Macs are going away, and run under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=fsrx-$version-$TARGET" >> "$GITHUB_ENV"
          echo "version $version"

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Run
        run: |
          bin=target/$TARGET/release/fsrx
          [ "$RUNNER_OS" = Windows ] && bin=$bin.exe
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            run() { arch -x86_64 "$bin" "$@"; }
          else
            run() { "$bin" "$@"; }
          fi
          reported=$(run --version)
          echo "$reported"
          if [ "$reported" != "fsrx $VERSION" ]; then
            echo "expected fsrx $VERSION" >&2
            exit 1
          fi
          echo "the quick brown fox jumps over the lazy dog" | run
          if [ "$RUNNER_OS" != Windows ]; then
            file "$bin"
          fi
          if [ "$RUNNER_OS" = Linux ] && ! file -b "$bin" | grep -Eq 'static(ally|-pie) linked'; then
            echo "expected a static binary" >&2
            exit 1
          fi

      # COPYFILE_DISABLE keeps macOS's tar from adding ._ files for extended attributes.
      - name: Package
        env:
          COPYFILE_DISABLE: 1
        run: |
          mkdir "$ASSET"
          cp README.md LICENSE.md "$ASSET/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/fsrx.exe" "$ASSET/"
            archive=$ASSET.zip
            7z a -tzip "$archive" "$ASSET"
            sha256sum "$archive" > "$archive.sha256"
          else
            install -m 0755 "target/$TARGET/release/fsrx" "$ASSET/fsrx"
            archive=$ASSET.tar.gz
            tar -czf "$archive" "$ASSET"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  # Gathers the release's files in one artifact on every run, so a pull request proves the whole set.
  assets:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      # Each archive must hold exactly the files the formula installs, with fsrx executable.
      - name: Check
        working-directory: assets
        run: |
          shasum -a 256 -c ./*.sha256
          for archive in fsrx-*.tar.gz; do
            dir=${archive%.tar.gz}
            echo "$archive"
            tar -tvzf "$archive"
            listed=$(tar -tzf "$archive" | sed 's|/$||' | sort)
            expected=$(printf '%s\n' "$dir" "$dir/LICENSE.md" "$dir/README.md" "$dir/fsrx" | sort)
            if [ "$listed" != "$expected" ]; then
              echo "$archive does not hold the expected files" >&2
              exit 1
            fi
            if ! tar -tvzf "$archive" "$dir/fsrx" | grep -q '^-rwxr-xr-x'; then
              echo "$archive: fsrx is not mode 0755" >&2
              exit 1
            fi
          done
          for archive in fsrx-*.zip; do
            dir=${archive%.zip}
            echo "$archive"
            unzip -l "$archive"
            listed=$(unzip -Z1 "$archive" | sed 's|/$||' | sort)
            expected=$(printf '%s\n' "$dir" "$dir/LICENSE.md" "$dir/README.md" "$dir/fsrx.exe" | sort)
            if [ "$listed" != "$expected" ]; then
              echo "$archive does not hold the expected files" >&2
              exit 1
            fi
          done
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: assets/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: assets

      - name: Publish the release
        run: |
          flags=(--generate-notes --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" assets/*

  # A release made with the workflow's token starts no other workflow, so the crate is published
  # here rather than from a `release` event.
  crate:
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --locked

  # Points jrnxf/homebrew-tap's Formula/fsrx.rb at this release's archives. The tap's
  # docs/automatic-updates.md issues the TAP_DEPLOY_KEY secret this needs.
  tap:
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check for the tap's key
        env:
          KEY_SET: ${{ secrets.TAP_DEPLOY_KEY != '' }}
        run: |
          if [ "$KEY_SET" != true ]; then
            echo "::error::TAP_DEPLOY_KEY is not set, so Formula/fsrx.rb was not updated: see jrnxf/homebrew-tap docs/automatic-updates.md"
            exit 1
          fi

      # Pinned to a commit: this job holds the key that can push to the tap brew installs from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jrnxf/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      # The formula used to build from the source archive with cargo. The first release from this
      # workflow rewrites it to install the binary, keeping cargo for `brew install --HEAD`; later
      # releases leave its shape alone and only move its urls.
      - name: Install the binary, not build it
        run: |
          if grep -q 'build.head?' Formula/fsrx.rb; then
            exit 0
          fi
          cat > Formula/fsrx.rb <<'EOF'
          class Fsrx < Formula
            desc "Flow state reading in the terminal"
            homepage "https://github.com/jrnxf/fsrx"
            license "MIT"

            head do
              url "https://github.com/jrnxf/fsrx.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                # A release is one archive per system and architecture, holding a prebuilt binary.
                bin.install "fsrx"
              end
            end

            test do
              assert_match(/fsrx \d+\.\d+\.\d+/, shell_output("#{bin}/fsrx --version"))
            end
          end
          EOF

      # The binary mode downloads each asset from the release and checks it against its .sha256.
      - run: |
          version=${TAG#v}
          scripts/bump-formula.sh fsrx "$TAG" \
            macos-arm="fsrx-$version-aarch64-apple-darwin.tar.gz" \
            macos-intel="fsrx-$version-x86_64-apple-darwin.tar.gz" \
            linux-arm="fsrx-$version-aarch64-unknown-linux-musl.tar.gz" \
            linux-intel="fsrx-$version-x86_64-unknown-linux-musl.tar.gz"

      - run: |
          if git diff --quiet; then
            echo "Formula/fsrx.rb already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fsrx $TAG"
          git push
